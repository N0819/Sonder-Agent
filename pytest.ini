; The workspace is a directory the ASSISTANT writes into, and the assistant's
; own source has been uploaded to it — so `pytest` with no path collected 21
; test modules out of `workspaces/` whose basenames collide with the real ones
; and died on the collision before running a single test. `make test` passes
; `tests/` and never saw it; a bare `pytest` is what a new contributor types.
;
; Nothing under a workspace is this project's code, whatever it looks like.
[pytest]
testpaths = tests
norecursedirs = workspaces subagent-archive .git *.egg build dist
